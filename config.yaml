# ─────────────────────────────────────────────────────────────
#  인줌 강의 녹화기 설정
#  값을 바꾼 뒤 저장하고 start.bat 을 다시 실행하면 적용됩니다.
# ─────────────────────────────────────────────────────────────

# 강의 목록 페이지 (로그인 후 차시 목록이 보이는 페이지)
list_url: https://edu.inzeum.com/classRoom/goContentsList

# 녹화 파일을 모아둘 폴더
output_dir: ./recordings

browser:
  # launch : 프로그램 전용 크롬 창을 띄움 (처음 한 번 그 창에서 로그인하면 계속 유지)
  # cdp    : 이미 켜둔 크롬에 연결 (README '크롬 직접 연결' 참고)
  mode: launch
  profile_dir: ./chrome-profile
  cdp_url: http://127.0.0.1:9222

lessons:
  # 사이트에서 이미 '완료'로 표시된 차시를 건너뛸지 (시작할 때 다시 물어봄)
  skip_completed: true
  # 시작할 때 차시 목록을 보여주고 건너뛰기/범위를 확인할지
  ask_on_start: true
  # 학습하기를 누르기 전에 기다리는 시간(초). 페이지가 다 준비되기 전에 누르면 상세페이지로 넘어갈 수 있음
  # 실패해서 다시 누를 때는 2배, 3배로 늘어남
  click_delay_sec: 3
  # 학습하기를 누르는 방법. 재생 창이 안 열리면 다음 방법으로 다시 시도
  #   normal = 자동화 클릭, js = 페이지 안에서 클릭, mouse = 실제 마우스 클릭
  click_methods: ["normal", "js", "mouse"]
  # 차시마다 있는 재생 버튼 글자 (여러 개 가능)
  study_button_texts: ["학습하기", "복습하기", "다시보기"]
  # 주차 제목 찾기 (정규식). 접힌 주차는 프로그램이 하나씩 눌러서 펼침
  section_pattern: "\\(\\s*\\d+\\s*주차\\s*\\)"
  section_selector: ""          # 직접 지정할 때만 (CSS 선택자)
  section_open_timeout_sec: 6   # 주차를 누른 뒤 차시가 나타날 때까지 기다리는 시간

  # ── 완료 차시 판단 (위에서부터 먼저 쓸 수 있는 방법 하나로 판단) ──
  # 1) completed_selector : 차시 줄 안에 이 CSS 선택자가 있으면 완료 (직접 지정할 때만)
  # 2) 아이콘 자동 학습   : '57분 / 57분'처럼 다 본 차시와 '0분 / 30분' 차시를 비교해
  #                         체크 아이콘 모양을 스스로 배움 (자동)
  # 3) completed_patterns : 차시 줄에 이 글자가 있으면 완료 ((?<!미)완료 = '미완료'는 제외)
  # 4) 시청시간           : 본 시간 ≥ 전체 시간 × completed_time_ratio 이면 완료
  completed_selector: ""
  completed_patterns: ["(?<!미)완료", "\\b100\\s*%"]
  time_pattern: "(\\d+)\\s*분\\s*/\\s*(\\d+)\\s*분"
  completed_time_ratio: 0.9

  # 자동 인식이 안 될 때만 직접 지정 (CSS 선택자, 비워두면 자동)
  row_selector: ""
  title_selector: ""

player:
  # 학습하기를 누르면 크롬 새 창(재생 창)이 열립니다.
  # 재생 창이 열릴 때까지 기다리는 최대 시간(초)
  appear_timeout_sec: 20
  # 주소에 이 글자가 있으면 재생 화면으로 봄 (예: edu.inzeum.com/bookMark/bookMarkInit)
  player_url_patterns: ["bookMark"]
  # 재생 창이 열린 뒤 화면 크기
  #   f11      : F11 과 같은 크롬 전체화면 (기본)
  #   maximize : 창 최대화만
  #   none     : 그대로
  window_mode: f11
  # 전체화면 뒤 "F11 키를 눌러 종료" 안내가 사라질 때까지 기다린 뒤 녹화 시작(초)
  fullscreen_settle_sec: 4
  # 녹화를 켠 뒤 재생 창에서 누를 시작 버튼 글자 (앞에서부터 찾음)
  start_button_texts: ["시작", "학습시작", "강의시작", "재생"]
  # 시작 버튼을 찾는 최대 시간(초). 못 찾으면 자동 재생으로 보고 계속 진행
  start_button_timeout_sec: 20
  # 한 차시 최대 녹화 시간(분). 넘으면 강제로 마무리
  max_minutes_per_lesson: 240
  # 영상 요소의 '재생 끝남'도 종료로 볼지 (알림창이 안 뜨는 경우 대비)
  end_on_video_ended: true

  # 웹 알림창(확인/취소 창) 처리 규칙 — 위에서부터 먼저 맞는 규칙 하나만 적용
  #   match  : 알림창 글자에서 찾을 정규식
  #   answer : accept = [확인],  dismiss = [취소]
  #   action : end   → 차시가 끝난 것으로 보고 녹화를 마침
  #            error → 녹화 프로그램 감지 등으로 재생 불가 → 전체 중단
  dialogs:
    - match: "-1015|-1002|\\b1002\\b|캡[처쳐]\\s*프로그램|녹화\\s*프로그램|다른 곳에서 재생"
      answer: accept
      action: error
    # 예: "강의영상이 완료 되었습니다. 창을 닫으시겠습니까?" → 확인 → 녹화 끝
    - match: "완료|종료|닫으시겠"
      answer: accept
      action: end
    # 이어보기 질문 → 취소 (처음부터 녹화). 이어서 보려면 accept 로 바꾸세요
    - match: "이어\\s*보|이어서|이전.*위치|마지막.*위치"
      answer: dismiss
    - match: ".*"
      answer: accept

recorder:
  # obs      : OBS Studio 로 녹화 (권장)
  # snipping : 윈도우 캡처 도구(Win+Shift+R) 로 녹화 (실험적)
  type: obs
  # false : 재생창이 뜨고 F11 전체화면이 된 뒤 녹화 시작 (기본, 깔끔함. 맨 앞 몇 초가 빠질 수 있음)
  # true  : 학습하기를 누르기 직전에 녹화 시작 (앞부분이 안 빠지지만 크롬 화면이 잠깐 찍힘)
  start_before_click: false
  # 차시가 끝난 뒤 녹화를 멈추기 전에 더 기다릴 시간(초)
  tail_sec: 2
  obs:
    host: localhost
    port: 4455
    password: ""
    # OBS 가 꺼져 있으면 이 경로로 자동 실행 (비우면 자동 실행 안 함)
    launch_path: C:\Program Files\obs-studio\bin\64bit\obs64.exe
  snipping:
    # 캡처 도구가 녹화를 자동 저장하는 폴더 (비우면 %USERPROFILE%\Videos\Screen Recordings)
    save_dir: ""

# 녹화를 시작하면 명령 창(검은 창)을 자동으로 내리고, 끝나면 다시 올림
minimize_console: true

# 차시와 차시 사이 쉬는 시간(초)
between_lessons_sec: 5
